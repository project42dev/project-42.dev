name: Deploy to GitHub Pages

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: github-pages
  cancel-in-progress: false

jobs:
  validate:
    name: Validate Pages candidate
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          persist-credentials: false
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7
        with:
          node-version: 22
          cache: npm
      - run: npm ci
        env:
          PUPPETEER_SKIP_DOWNLOAD: "true"
      - run: npx playwright install --with-deps chromium --only-shell
      # The mobile-viewport gate runs on WebKit, the engine Mobile Safari uses.
      - run: npx playwright install --with-deps webkit
      # The device matrix runs a Firefox row: Gecko clips differently from
      # Blink and WebKit, which is how the header nav was caught clipping the
      # About panel on every tablet held upright.
      - run: npx playwright install --with-deps firefox
      - run: npm run check
        env:
          # The full device matrix remains required in CI; Pages validation uses
          # the desktop/mobile smoke set so publishing cannot stall on redundant rows.
          PROJECT42_DEVICE_MATRIX: 'off'

  package:
    name: Package validated Pages artifact
    if: github.event_name == 'push' && github.ref == 'refs/heads/main' && github.repository == 'project42dev/project-42.dev'
    needs: validate
    runs-on: ubuntu-latest
    permissions:
      contents: read
      pages: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          persist-credentials: false
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7
        with:
          node-version: 22
          cache: npm
      - name: Configure Pages
        uses: actions/configure-pages@45bfe0192ca1faeb007ade9deae92b16b8254a0d # v6
      - run: npm ci
        env:
          PUPPETEER_SKIP_DOWNLOAD: "true"
      - run: npm run pages:build
      - name: Upload validated Pages artifact
        uses: actions/upload-pages-artifact@fc324d3547104276b827a68afc52ff2a11cc49c9 # v5
        with:
          path: dist/pages

  deploy:
    if: github.event_name == 'push' && github.ref == 'refs/heads/main' && github.repository == 'project42dev/project-42.dev'
    needs: package
    runs-on: ubuntu-latest
    permissions:
      contents: read
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/deploy-pages@cd2ce8fcbc39b97be8ca5fce6e763baed58fa128 # v5
        id: deployment

  # T-02. A deploy is not finished until a learner's work is proven to persist
  # on it. The platform's hosted smoke signs in as the smoke account, records
  # one module completion through the account API, reads it back from a fresh
  # signed-in session (progress read and module_progress rows), and removes it.
  # A red run here means the site is live but learner progress is not saving.
  #
  # Variables resolve from THIS repository (or the org):
  # PROJECT42_HOSTED_LEARN_ORIGIN, PROJECT42_HOSTED_API_ORIGIN and
  # PROJECT42_HOSTED_ISSUER. Only the three smoke secrets are passed -- not
  # `secrets: inherit`, which would hand every secret here to the called
  # workflow. The workflow ref and platform-ref name the same
  # project42-platform commit; move them together.
  #
  # Pinned to platform main 00e1380 (was 0ba1b310 / v0.112.0, which predates
  # every one of these): 162fbf8 adds playwright as a dependency so the smoke
  # script's own import resolves, dc53681 turns off the Chromium sandbox the
  # hosted runner's user namespaces refuse, 2a1e318/4f06a65 handle the
  # Entra External ID authorization host and its interstitial pages, and
  # 0ffc3bd/00e1380 name each interstitial in the failure output. Without
  # this bump the called workflow itself -- not this repo's copy of the
  # script -- is the pre-fix version, which is why the job failed with
  # ERR_MODULE_NOT_FOUND on every run since 2026-09-12 (AB#6167).
  post-deploy-smoke:
    name: Verify hosted sign-in and progress persistence
    if: github.event_name == 'push' && github.ref == 'refs/heads/main' && github.repository == 'project42dev/project-42.dev'
    needs: deploy
    permissions:
      contents: read
    uses: project42dev/project42-platform/.github/workflows/hosted-smoke.yml@eea06d1ddbdfb02a38625e98254fb94af5bc975b
    with:
      platform-ref: eea06d1ddbdfb02a38625e98254fb94af5bc975b
    secrets:
      PROJECT42_HOSTED_SMOKE_EMAIL: ${{ secrets.PROJECT42_HOSTED_SMOKE_EMAIL }}
      PROJECT42_HOSTED_SMOKE_PASSWORD: ${{ secrets.PROJECT42_HOSTED_SMOKE_PASSWORD }}
      PROJECT42_HOSTED_SMOKE_SUBJECT: ${{ secrets.PROJECT42_HOSTED_SMOKE_SUBJECT }}
