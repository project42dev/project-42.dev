name: Dated deferrals

# An expiry that is only checked when somebody happens to push is not an
# expiry. This runs on its own each morning so the date alone is enough to
# fail, without waiting for the next change. It needs no build and no network,
# so it costs a few seconds.

on:
  schedule:
    - cron: "23 7 * * *"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  deferrals:
    name: Fail once a dated exception has expired
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          persist-credentials: false
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7
        with:
          node-version: 22
      - name: Check dated link-check exceptions
        run: node scripts/dated-deferrals.mjs
